<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="seelynow amblemi — turuncu daire içinde 4x4 nokta ızgarası, köşe noktaları mor-mavi ışıklı">
  <defs>
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
    <filter id="cornerBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#FF6A2B"/>

  <g fill="url(#cornerGlow)" filter="url(#cornerBlur)" opacity=".8">
    <circle cx="70" cy="70" r="10.4"/>
    <circle cx="130" cy="70" r="10.4"/>
    <circle cx="70" cy="130" r="10.4"/>
    <circle cx="130" cy="130" r="10.4"/>
  </g>

  <g>
    <circle cx="70"  cy="70"  r="6.4" fill="url(#cornerGlow)"/>
    <circle cx="90"  cy="70"  r="6.4" fill="#ffffff"/>
    <circle cx="110" cy="70"  r="6.4" fill="#ffffff"/>
    <circle cx="130" cy="70"  r="6.4" fill="url(#cornerGlow)"/>

    <circle cx="70"  cy="90"  r="6.4" fill="#ffffff"/>
    <circle cx="90"  cy="90"  r="6.4" fill="#ffffff"/>
    <circle cx="110" cy="90"  r="6.4" fill="#ffffff"/>
    <circle cx="130" cy="90"  r="6.4" fill="#ffffff"/>

    <circle cx="70"  cy="110" r="6.4" fill="#ffffff"/>
    <circle cx="90"  cy="110" r="6.4" fill="#ffffff"/>
    <circle cx="110" cy="110" r="6.4" fill="#ffffff"/>
    <circle cx="130" cy="110" r="6.4" fill="#ffffff"/>

    <circle cx="70"  cy="130" r="6.4" fill="url(#cornerGlow)"/>
    <circle cx="90"  cy="130" r="6.4" fill="#ffffff"/>
    <circle cx="110" cy="130" r="6.4" fill="#ffffff"/>
    <circle cx="130" cy="130" r="6.4" fill="url(#cornerGlow)"/>
  </g>
</svg>
